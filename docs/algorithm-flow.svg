      <text x="409" y="111">Attack RMS Ratio</text><text x="409" y="237">Release RMS Ratio</text>
      <text x="605" y="70">A in dB</text><text x="605" y="192">2 ms slope detector</text><text x="605" y="209">Attack priority</text><text x="605" y="316">R in dB</text>
