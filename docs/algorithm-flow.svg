      <path d="M482 97H506V160H530"/><path d="M482 223H506V200H530"/>
      <path d="M680 57H702V162H720"/><path d="M680 303H702V198H720"/><path d="M680 180H720"/>
      <path d="M832 180H864"/>
      <path d="M75 192V375H919V214"/>
