<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">AzmBezierGate signal flow</title>
  <desc id="desc">Peak and RMS detection feed independent attack and release mixes. Their levels drive direction selection and curves. The selected target is smoothed and applied equally to both input channels.</desc>
