<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" role="img" aria-labelledby="title desc">
  <title id="title">Quadratic Bezier curve shapes</title>
  <desc id="desc">Three curves share a closed endpoint at minus Range and an open endpoint at zero. One control point shapes each one: a late-opening curve, a straight line and an early-opening curve.</desc>
  <rect width="900" height="380" rx="16" fill="#f3f5f9"/>
  <rect x="100" y="38" width="590" height="265" rx="10" fill="#1f2e54"/>
  <g stroke="#4a5e94" stroke-width="1"><path d="M100 78H690 M100 263H690"/><path d="M250 38V303 M530 38V303" stroke-dasharray="5 5"/></g>
  <path d="M100 263H250 Q460 216.8 530 78 H690" fill="none" stroke="#f0b13a" stroke-width="5"/>
  <path d="M100 263H250 Q390 170.5 530 78 H690" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="8 6"/>
  <path d="M100 263H250 Q320 124.3 530 78 H690" fill="none" stroke="#9dbaf1" stroke-width="5"/>
  <g font-family="Arial, sans-serif" fill="#1f2e54" font-size="16">
    <text x="82" y="84" text-anchor="end">0 dB</text><text x="82" y="269" text-anchor="end">−Range</text>
    <text x="250" y="329" text-anchor="middle">Close</text><text x="530" y="329" text-anchor="middle">Open</text>
    <text x="395" y="361" text-anchor="middle" fill="#5f6b8a">Detected level (dB) →</text>
    <text x="20" y="26" fill="#5f6b8a">Gain (dB)</text>
    <path d="M723 110h34" stroke="#f0b13a" stroke-width="5"/><text x="768" y="116">Late opening</text>
    <path d="M723 148h34" stroke="#1f2e54" stroke-width="3" stroke-dasharray="8 6"/><text x="768" y="154">Straight</text>
    <path d="M723 186h34" stroke="#9dbaf1" stroke-width="5"/><text x="768" y="192">Early opening</text>
  </g>
</svg>
